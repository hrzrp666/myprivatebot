name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TELEGRAM_TOKEN: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      GEMINI_API_KEY: "test-key"
      CHAT_ID: "-100123"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyflakes
      - name: Syntax and unused-name check
        run: |
          python -m compileall -q .
          python -m pyflakes *.py tests/*.py
      - name: Import the whole bot (no network)
        run: python -c "import bot"
      - name: Smoke check on SQLite
        env:
          DB_PATH: ${{ runner.temp }}/smoke.db
        run: python tests/smoke_check.py
      - name: Smoke check on Postgres
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/bot
        run: python tests/smoke_check.py
